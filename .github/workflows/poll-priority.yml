name: Poll PRIORITY tickets (3 min)

# Fast lane: only scrapes the slugs flagged by /api/priority-slugs
# (sold-out events + events with premium categories sold out). Each run is a
# single scrape of the small priority set — usually <10 events.

on:
  schedule:
    - cron: "*/3 * * * *"   # every 3 minutes
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/poll.py"
      - ".github/workflows/poll-priority.yml"

concurrency:
  group: poll-tickets-priority
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -q -r scripts/requirements.txt

      - name: Single priority scrape (mode=priority)
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          SNAPSHOT_SECRET: ${{ secrets.SNAPSHOT_SECRET }}
          WEBSHARE_PROXIES: ${{ secrets.WEBSHARE_PROXIES }}
        run: python scripts/poll.py --mode priority
